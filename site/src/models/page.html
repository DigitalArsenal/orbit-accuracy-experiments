<!doctype html>
<html lang="en" data-base="{{base}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="{{base}}coi-serviceworker.js"></script>
    <script>
      // ?theme=light|dark from the embedding paper app; otherwise the site's choice.
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        if (!t) try { t = localStorage.getItem('sdn-theme'); } catch (e) {}
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>{{title}} · Orbit Accuracy Experiments</title>
    <meta name="description" content="{{claim}}" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><defs><linearGradient id='t' gradientUnits='userSpaceOnUse' x1='16' y1='29' x2='16' y2='3'><stop offset='0' stop-color='%23f5a524' stop-opacity='0'/><stop offset='.55' stop-color='%23f5a524' stop-opacity='.55'/><stop offset='1' stop-color='%23f5a524'/></linearGradient></defs><circle cx='16' cy='16' r='13' stroke='%23f5f5f7' stroke-width='1.6' opacity='.3'/><path d='M16 29A13 13 0 0 1 16 3' stroke='url(%23t)' stroke-width='2.2' stroke-linecap='round'/><path d='M16 10.2L10.4 20.1H21.6Z' stroke='%23f5f5f7' stroke-width='1.6' stroke-linejoin='round'/><circle cx='16' cy='10.2' r='2.6' fill='%23f5f5f7'/><circle cx='10.4' cy='20.1' r='2.6' fill='%23f5f5f7'/><circle cx='21.6' cy='20.1' r='2.6' fill='%23f5f5f7'/><circle cx='16' cy='3' r='2.5' fill='%23f5a524'/></svg>" />
    <link rel="stylesheet" href="{{base}}site.css" />
    <link rel="stylesheet" href="{{base}}models.css" />
    <script type="module" src="{{base}}models.js"></script>
  </head>
  <body class="model-page" data-paper="{{paper}}" data-model="{{model}}" data-state="loading">
    <main class="model">
      <header class="model-head">
        <p class="eyebrow"><a href="{{paperUrl}}" target="_blank" rel="noopener">{{paperTitle}} · {{heading}}</a></p>
        <h1>{{title}}</h1>
        <p class="claim">{{claim}}</p>
      </header>
      <div id="model"></div>
      <p class="status model-status" id="model-status" role="status" aria-live="polite">Loading…</p>
      <footer class="model-foot">
        <div hidden>Computed in this browser by <ul id="model-modules"></ul></div>
        <nav>
          <a href="{{paperUrl}}" target="_blank" rel="noopener">The paper section ↗</a>
          <a href="{{base}}models/index.html">All models</a>
          <a href="{{base}}" target="_blank" rel="noopener">Orbit Accuracy Experiments ↗</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
